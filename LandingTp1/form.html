<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmá tu inscripción</title>
    <link rel="stylesheet" href="./estilos.css">
</head>

<body>
    <header class="header">
        <img src="imagenes/logomotorsport.png" alt="Logo Motorsport">
    </header>
    <section class="form">
      <div class="form-contenedor">
        <p class="form-subtitulo">Rellena los siguientes campos para confirmar la inscripción. Cupos limitados.</p>
        <form action="">
            <label for="nombre">¿Cual es tu nombre?</label>
            <input type="text" name="nombre" id="nombre" placeholder="Escribi tu nombre" required>
            <br>
            <br>
            <label for="exp">¿Tenes experiencia en mecanica?</label>
            <input type="text" name="exp" id="exp" placeholder="Indica tu experiencia">
            <br>
            <br>
            <label for="edad">¿Cuantos años tenes?</label>
            <input type="number" name="edad" id="edad" placeholder="Indica tu edad" required>
            <br>
            <br>
            <label for="mail">Email de contacto</label>
            <input type="email" name="mail" id="mail" placeholder="ejemplo@mail.com"required>
            <br>
            <br>
            <input type="submit" class="boton" id="enviar" value="Confirmar inscripción" href="feedback.html"></input>
        </form>
        </div>
    </section>


  <footer class="footer">
    <div class="redes">
      <a href="https://www.facebook.com/motorsportcom.latinoamerica">F</a>
      <a href="https://www.instagram.com/motorsport.com_lat">IG</a>
      <a href="https://x.com/Motorsport_lat">TW</a>

      <a href="https://www.youtube.com/channel/UCWUWDdWfhga0ww7Jer7eLWw/featured?view_as=subscriber">YT</a>
    </div>
    <nav class="links">
      <a href="https://lat.motorsport.com/rss/">Acerca de MotorSport</a>
      <span>|</span>
      <a href="https://lat.motorsport.com/info/contact/">Contacto</a>
      <span>|</span>
      <a href="https://accounts.motorsportnetwork.com/legal/privacy-policy">Política de Privacidad</a>
    </nav>
  </footer>
  <script src="./script.js"></script>
</body>

</html>
